# Host-neutral review backend registry.
#
# This file describes how a backend can be invoked.  It deliberately does not
# select a backend and it does not contain model/profile bindings.  Selection
# belongs to routing-policy.yaml; native model bindings belong to
# model-bindings.yaml.

schema: dd-review-backends/1
result_schema: dd-review-result/1

backends:
  chatgpt-tunnel:
    # Grilling multi-round backend (DEC-MB-02).  The reviewer reads the repo
    # itself through the approved read-only Tunnel using `work/<relative>` repo
    # names; the local side never sends absolute paths or file contents, so the
    # readonly model is self-read via Tunnel rather than snapshot-send-only.
    # Not router-selectable: single-hop dispatch uses mcp-review; this backend
    # is consumed by gpt-grilling-review's stateful loop through its transport
    # contract (chatgpt_send / chatgpt_get_result with conversation_id reuse,
    # owned by gpt-grilling-review/references/transport.md).
    type: mcp
    execution: external
    executable: chatgpt-tunnel
    command: [review]
    router_selectable: false
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: tunnel-self-read-only
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  mcp-review:
    type: mcp
    execution: external
    executable: mcp-review
    command: [review]
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: snapshot-send-only
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  codex-cli:
    # Same-session collaboration is an explicit opt-in transport. Its result
    # is never passed through the legacy read-only review normalizer.
    collaboration:
      initial: [codex, exec, --sandbox, workspace-write, --json, --model, "{model}", -c, 'model_reasoning_effort={effort_toml}', -]
      resume: [codex, exec, resume, "{session}", --json, --model, "{model}", -c, 'model_reasoning_effort={effort_toml}', -]
    type: cli
    execution: external
    executable: codex-review
    # Thin adapter: codex-review handles Codex JSONL event stream and strict JSON
    # validation. Underlying invocation is `codex exec --sandbox read-only --json`
    # (initial) or `codex exec resume <handle> --json` (resume).  Resume accepts
    # neither --sandbox nor an effective -c sandbox= override (contrast evidence:
    # tests/evidence/codex-resume-readonly-evidence.yaml); the sandbox policy is
    # mechanically inherited from the original session, so codex-review only
    # resumes handles it registered as read-only at initial time (provenance
    # registry, fail-closed before provider invocation).
    command: [review]
    # LATER-20260907: advisory dispatch proven on 0.153.4 (see
    # codex-advisory-readonly-evidence.yaml); the adapter injects the mode
    # profile's developer_instructions into the prompt.
    capabilities: [strong-review, advisory]
    advisory_result_schema: dd-advisory-result/1
    # FR-MB-004 amendment (2026-10-19 user decision): readonly evidence for this
    # backend is waived -- the L6 proofs must no longer be re-collected on every
    # CLI version bump or model change (the friction was the evidence chain, not
    # the sandbox).  The OS-level `--sandbox read-only` invocation and the
    # read-only thread provenance gate stay in place, and the adapter verifies
    # the frozen baseline at admission AND after every round (including before a
    # timeout fallback): a round that mutates the repository voids itself as
    # baseline_mismatch (fail-closed).  Accepted results carry the non-readonly
    # marker and MUST NEVER back a finding CLOSED (gpt-grilling-review
    # transport).  Historical evidence retained for the restore path:
    # tests/evidence/codex-cli-l6-evidence.yaml,
    # tests/evidence/codex-resume-readonly-evidence.yaml.
    readonly_required: false
    readonly_mode: none
    readonly_exception: docs/AI/later/LATER-20261019-codex-cli-nonreadonly-reviewer.md
    # FR-MB-015 / FR-MB-016: continuation forms and the structured session
    # identity contract.  codex-review maps a `resume` continuation onto
    # `codex exec resume <handle>` and reports the engine-minted thread id
    # (from the `thread.started` event, stable across resume turns) under the
    # canonical result field `session`.
    invocation_forms: [initial, resume]
    session_identity:
      field: session
      owner: codex-review
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  opencode-cli:
    collaboration:
      initial: [opencode, run, --standalone, --agent, build, --format, json, --model, "{model_variant}"]
      resume: [opencode, run, --standalone, --agent, build, --format, json, --model, "{model_variant}", --session, "{session}"]
    type: cli
    execution: external
    executable: opencode-review
    # Thin adapter: opencode-review handles the NDJSON event stream from
    # `opencode run --agent strong-reviewer-cli --format json` and strict-parses
    # the final assistant JSON into dd-review-result/1. The underlying
    # invocation (strong-reviewer-cli primary-mode, muse-spark) and readonly
    # contract are unchanged (L6 proof remains valid).
    command: [review]
    forbid_args: [--auto]
    # Per-call reviewer model pin: the Router may forward a shape-validated
    # request.model to this backend only; the adapter maps it onto
    # `opencode run --model <id>` keeping the agent profile (mode, readonly
    # contract) fixed.  The pin is single-round (canonical bindings untouched)
    # and always gated on per-model L6 evidence; resume rounds must not pin.
    per_call_model: true
    # LATER-20260907: advisory dispatch (decision-point advice).  The capability
    # is bound to its wire contract; advisory rounds emit dd-advisory-result/1
    # and never enter the finding closure vocabulary.
    capabilities: [strong-review, advisory]
    advisory_result_schema: dd-advisory-result/1
    # FR-MB-015 / FR-MB-016 / MB-GRILL-020: continuation forms and the
    # structured session identity contract.  opencode-review maps a `resume`
    # continuation onto `opencode run --session <handle>` and reports the
    # engine-minted session under the canonical result field `session`.
    invocation_forms: [initial, resume]
    session_identity:
      field: session
      owner: opencode-review
    # FR-MB-004 amendment (2026-09-23 user decision): the OpenCode Zen free
    # tier rejects every capability-restricted agent (403 FreeTierError) and
    # the account has no funded tier, so the mechanically read-only reviewer
    # profile can never run on the canonical model.  Rather than fake a
    # readonly proof, this backend is registered as an explicit non-readonly
    # reviewer: it may produce findings and re-review rounds, but accepted
    # results carry `readonly_confirmation.confirmed = false` and must never
    # back a finding CLOSED (gpt-grilling-review transport contract).
    # Historical continuation-form readonly evidence for the pre-amendment
    # contract: tests/evidence/opencode-resume-readonly-evidence.yaml
    # (2026-09-03, opencode 1.18.25) and opencode-cli-l6-evidence.yaml.
    # Restore `readonly_required: true` + `agent-read-only-contract` when the
    # provider or plan allows a restricted agent again (LATER-20260923).
    readonly_required: false
    readonly_mode: none
    readonly_exception: docs/AI/later/LATER-20260923-opencode-nonreadonly-reviewer.md
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  codex-native:
    # Generic Router cannot prove current-parent thread provenance.  The
    # verified host-native dispatcher owns this handoff after route-guard.
    type: native
    execution: native-agent
    host: codex
    executable: codex
    command: [exec, --sandbox, read-only]
    native_guard: codex-route-guard
    router_selectable: false
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: codex-route-guard
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  opencode-native:
    type: native
    execution: native-agent
    host: opencode
    executable: opencode
    command: [run, --agent, strong-reviewer, --format, json]
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: agent-read-only-contract
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1
