# Host-neutral review backend registry.
#
# This file describes how a backend can be invoked.  It deliberately does not
# select a backend and it does not contain model/profile bindings.  Selection
# belongs to routing-policy.yaml; native model bindings belong to
# model-bindings.yaml.

schema: dd-review-backends/1
result_schema: dd-review-result/1

backends:
  chatgpt-tunnel:
    # Grilling multi-round backend (DEC-MB-02).  The reviewer reads the repo
    # itself through the approved read-only Tunnel using `work/<relative>` repo
    # names; the local side never sends absolute paths or file contents, so the
    # readonly model is self-read via Tunnel rather than snapshot-send-only.
    # Not router-selectable: single-hop dispatch uses mcp-review; this backend
    # is consumed by gpt-grilling-review's stateful loop through its transport
    # contract (chatgpt_send / chatgpt_get_result with conversation_id reuse,
    # owned by gpt-grilling-review/references/transport.md).
    type: mcp
    execution: external
    executable: chatgpt-tunnel
    command: [review]
    router_selectable: false
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: tunnel-self-read-only
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  mcp-review:
    type: mcp
    execution: external
    executable: mcp-review
    command: [review]
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: snapshot-send-only
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  codex-cli:
    type: cli
    execution: external
    executable: codex-review
    # Thin adapter: codex-review handles Codex JSONL event stream and strict JSON
    # validation. Underlying invocation is `codex exec --sandbox read-only --json`
    # (initial) or `codex exec resume <handle> --json` (resume).  Resume accepts
    # neither --sandbox nor an effective -c sandbox= override (contrast evidence:
    # tests/evidence/codex-resume-readonly-evidence.yaml); the sandbox policy is
    # mechanically inherited from the original session, so codex-review only
    # resumes handles it registered as read-only at initial time (provenance
    # registry, fail-closed before provider invocation).
    command: [review]
    # LATER-20260907: advisory capability is NOT yet declared for codex-cli —
    # the advisory invocation form has no backend-bound readonly/result-format
    # evidence yet (FR-MB-012 gate).  Declare it only after a forensic run of
    # the dedicated advisory profile (mirror opencode-advisory-readonly-evidence.yaml).
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: codex-read-only-transport
    # FR-MB-015 / FR-MB-016: continuation forms and the structured session
    # identity contract.  codex-review maps a `resume` continuation onto
    # `codex exec resume <handle>` and reports the engine-minted thread id
    # (from the `thread.started` event, stable across resume turns) under the
    # canonical result field `session`.
    invocation_forms: [initial, resume]
    session_identity:
      field: session
      owner: codex-review
    # FR-MB-004.3 / FR-MB-012: continuation-form readonly evidence captured
    # (tests/evidence/codex-resume-readonly-evidence.yaml, 2026-09-07).
    continuation_readonly_evidence: true
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  opencode-cli:
    type: cli
    execution: external
    executable: opencode-review
    # Thin adapter: opencode-review handles the NDJSON event stream from
    # `opencode run --agent strong-reviewer-cli --format json` and strict-parses
    # the final assistant JSON into dd-review-result/1. The underlying
    # invocation (strong-reviewer-cli primary-mode, muse-spark) and readonly
    # contract are unchanged (L6 proof remains valid).
    command: [review]
    forbid_args: [--auto]
    # LATER-20260907: advisory dispatch (decision-point advice).  The capability
    # is bound to its wire contract; advisory rounds emit dd-advisory-result/1
    # and never enter the finding closure vocabulary.
    capabilities: [strong-review, advisory]
    advisory_result_schema: dd-advisory-result/1
    # FR-MB-015 / FR-MB-016 / MB-GRILL-020: continuation forms and the
    # structured session identity contract.  opencode-review maps a `resume`
    # continuation onto `opencode run --session <handle>` and reports the
    # engine-minted session under the canonical result field `session`.
    invocation_forms: [initial, resume]
    session_identity:
      field: session
      owner: opencode-review
    # FR-MB-004.3 / FR-MB-012: continuation-form readonly evidence captured
    # (tests/evidence/opencode-resume-readonly-evidence.yaml, 2026-09-03).
    continuation_readonly_evidence: true
    readonly_required: true
    readonly_mode: agent-read-only-contract
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  codex-native:
    # Generic Router cannot prove current-parent thread provenance.  The
    # verified host-native dispatcher owns this handoff after route-guard.
    type: native
    execution: native-agent
    host: codex
    executable: codex
    command: [exec, --sandbox, read-only]
    native_guard: codex-route-guard
    router_selectable: false
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: codex-route-guard
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1

  opencode-native:
    type: native
    execution: native-agent
    host: opencode
    executable: opencode
    command: [run, --agent, strong-reviewer, --format, json]
    capabilities: [strong-review]
    readonly_required: true
    readonly_mode: agent-read-only-contract
    availability_exit_codes: [69]
    transient_exit_codes: [75]
    result_schema: dd-review-result/1
