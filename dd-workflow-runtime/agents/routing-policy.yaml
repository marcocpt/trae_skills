# Host-neutral ordered backend selection.  The registry owns invocation
# metadata; this file owns policy and fallback order.

schema: dd-routing-policy/1
max_hops: 1

roles:
  strong-reviewer:
    capability: strong-review
    max_hops: 1
    backends: [mcp-review, codex-cli, host-native]
    fallback_on: [backend_unavailable, executable_missing, endpoint_unavailable, capability_unavailable, temporary_backend_failure]

# Grilling first-round candidate order (FR-MB-018 / MB-GRILL-020).  Consumed by
# gpt-grilling-review for PRE_INITIAL_REVIEW fallback ordering; NOT consumed by
# the Router's dispatch loop, so members MAY be grilling-only backends that are
# router_selectable: false.  Members must satisfy the FR-MB-001 qualification
# contract: a runtime-owned structured session identity (FR-MB-016), an
# adapter-provided continuation form (FR-MB-015), and a backend-bound readonly
# proof covering that exact invocation form (FR-MB-001.3 / FR-MB-004.3).
#
# EMPTY ORDER (MB-GRILL-020, transitional, honest state): no member qualifies
# yet -- the runtime session-identity contract (FR-MB-016) is not landed and no
# backend-bound continuation evidence exists, so even chatgpt-tunnel does not
# qualify.  gpt-grilling-review MUST treat an empty order as
# backend_unavailable instead of self-ordering (FR-MB-018.4).
stateful_roles:
  strong-reviewer-stateful:
    capability: strong-review
    backends: []
    fallback_on: [backend_unavailable, executable_missing, endpoint_unavailable, capability_unavailable, temporary_backend_failure]

host_native:
  codex: codex-native
  opencode: opencode-native
