# Resume-invocation-form permission-contract continuity evidence for
# opencode-cli (FR-MB-004.3 / FR-MB-012 / §8 #2).
#
# Question under test (§8 #2): when the grilling loop resumes
# `opencode run --session <sessionID>` with the strong-reviewer-cli agent,
# does the mechanical readonly permission contract survive into the resumed
# session, or does the resumed turn regain write capability?
#
# Evidence quality notes (post reviewer round 1, task in conversation
# wb-20260902-b996): reviewer ruled VERIFICATION_REQUIRED because the first
# probe set only had AGENT-SELF-REPORTED tool availability (no engine tool
# schema, no denial event, no executed read).  A second probe round (C/D)
# was added with POSITIVE read tool events in both turns.  Evidence grades:
#   - allow-side continuity: EVENT-BACKED (read tool_use, status completed,
#     in both initial and resume turns)
#   - write-deny continuity: AGENT-SELF-REPORTED (write tool never exposed,
#     so no engine denial event exists; both turns self-report the same
#     limited tool set) -- strong but not event-backed.
