  - "Evidence is bounded to: backend=opencode-cli, agent=strong-reviewer-cli, opencode=1.18.25, invocation form=opencode run --session <sessionID> --agent strong-reviewer-cli --format json.  It does not extrapolate to other agents, versions, or invocation forms."
