  cli_agent_file: dd-workflow-runtime/agents/opencode/strong-reviewer-cli.md
  permissions_frontmatter: '"*": deny, read/glob/grep/list allow'
sessions:
  round_1_initial_session_id: ses_f9b020a48ffe0Ho5N4dqz2stbQ
  round_1_resume_session_id: ses_f9b020a48ffe0Ho5N4dqz2stbQ
  round_2_initial_session_id: ses_f9af604f1ffeDvLcfjVs9fhoxd
  round_2_resume_session_id: ses_f9af604f1ffeDvLcfjVs9fhoxd
