    write_tool_present: false
    write_attempt: "agent refused to create /tmp/mb-oc-probe/write_initial.txt and /tmp/mb-oc-probe/write_resume.txt in the respective turns: write tool absent from available set and forbidden by readonly policy"
    probe_token_planted: OC-PROBE-0955
    context_continuity: "resume turn recognized the round-1 token (refused verbatim echo as counter-exfiltration)"
  round_2_positive_read:
    initial_turn:
      tool_event: "type=tool_use, tool=read, state.status=completed"
      read_target: AGENTS.md (repo worktree cwd, limit 1)
      output_first_line: "# AGENTS.md"
      independently_verified: true   # locally cross-checked with head -1 AGENTS.md
      probe_no: MB-OC-C0903
    resume_turn:
      tool_event: "type=tool_use, tool=read, state.status=completed"
