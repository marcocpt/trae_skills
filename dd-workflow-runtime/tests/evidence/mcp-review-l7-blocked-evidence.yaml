router_observation:
  id: OBS-L7-001
  severity: MEDIUM
  title: Router masks terminal adapter failure_category as readonly_violation
  detail: >-
    When an adapter returns BLOCKED with a non-fallback failure_category and
    readonly_confirmation.confirmed=false, dispatch-review.py raises
    readonly_violation instead of surfacing the adapter category. The real cause
    here was schema_invalid, so the Router-visible category misattributes a
    provider-contract failure to the read-only contract.
  location: dd-workflow-runtime/agents/dispatch-review.py
  impact: >-
    Fail-closed behaviour is still correct and no unsafe result is accepted, but
    L7 failure triage is misleading.
  fixed_in_this_round: false
  reason_not_fixed: >-
    Phase E is a verification round. Changing production Router behaviour was out
    of scope and would not change this BLOCKED outcome.
