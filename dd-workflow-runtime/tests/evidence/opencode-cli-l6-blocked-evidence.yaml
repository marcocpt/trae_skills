observation:
  id: OBS-OPENCODE-L6-001
  severity: HIGH
  title: opencode-cli backend command cannot enforce the readonly agent contract
  detail: >-
    review-backends.yaml declares command [run, --agent, strong-reviewer, --format, json],
    but on opencode 1.18.23 this silently runs the default build agent because
    strong-reviewer is mode:subagent. Any real dispatch through this backend today
    would hand a frozen review request to a write-capable agent instead of the
    readonly reviewer.
  impact: >-
    opencode-cli is NOT safe to dispatch until the invocation contract is fixed
    (candidate fixes need their own verification round: e.g. a primary-mode
    readonly agent variant, or a supported CLI flag to force subagent execution).
    Registry/contract intentionally NOT modified in this round per fail-closed
    discipline.
  fixed_in_this_round: false
