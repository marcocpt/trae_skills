# Advisory invocation-form result-contract & permission evidence for
# opencode-cli (FR-MB-012 re-capture after LATER-20260907 changed the result
# contract surface; §8 #1 methodology reused).
#
# Questions under test:
#   Q1. Can the advisory round produce a valid dd-advisory-result/1 on a real
#       muse-spark run (result-format contract)?
#   Q2. Does the session identity stay continuous across advisory
#       initial -> resume (FR-MB-016 ground for session_resume_mismatch)?
#   Q3. Is the advisory profile's readonly permission contract actually
#       bounding the model (agent-read-only-contract)?
#
# Forensic finding that shaped the design: with a DUAL-mode contract on the
# shared strong-reviewer-cli profile, muse-spark wrapped the decision advice
# into a finding (HUMAN_DECISION_REQUIRED) on an advisory request -- rejected
# by the adapter's cross-mode gate (raw stream kept as
# opencode-advisory-probe-raw-dualmode-reject.json).  Two probe rounds
# confirmed the failure was reproducible, so advisory rounds pin a DEDICATED
# single-mode profile (strong-reviewer-advisory-cli) whose permission
# frontmatter is identical to the L6-proven finding profile.
#
# Evidence grading (same discipline as the 2026-09-03 finding capture):
#   - result-format contract: EVENT-BACKED -- real ADVISORY envelopes produced
#     end-to-end by the adapter on real muse-spark runs, raw NDJSON archived.
#   - session identity continuity: EVENT-BACKED -- the raw NDJSON of both
#     turns carries the same sessionID.
#   - write-deny continuity: AGENT-SELF-REPORTED + PARENT-FILESYSTEM-VERIFIED
#     -- the permission frontmatter exposes no write tool, so no engine
#     denial event can exist; the parent process verified no mutation after
#     every probe turn.
#   - allow-side continuity: EVENT-BACKED -- positive read with locally
#     cross-checked content.
