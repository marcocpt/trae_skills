# Resume-invocation-form permission-contract continuity evidence for
# codex-cli (FR-MB-004.3 / FR-MB-012 / MB-GRILL-020).
#
# Question under test: when the grilling loop resumes
# `codex exec resume <thread_id> --json` (prompt via stdin), does the
# read-only sandbox survive into the resumed turn, or does the resumed turn
# regain write capability?  Continuity of the engine-minted thread identity
# across turns is also captured (FR-MB-016 ground for session_resume_mismatch).
#
# Evidence grading:
#   - write-deny continuity: EVENT-BACKED — the sandbox denial is the shell's
#     own "operation not permitted" error surfaced through the turn's
#     command execution, plus parent-process filesystem verification after
#     both turns (sha256 unchanged, no created file, git clean).
#   - allow-side continuity: EVENT-BACKED — the resumed turn read
#     protected.txt and reported its exact content (independently cross-checked).
#   - session identity continuity: EVENT-BACKED — the `thread.started` event
#     of the resumed turn carries the same thread_id as the initial turn.
