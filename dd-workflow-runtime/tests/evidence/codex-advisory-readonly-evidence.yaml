# pre-LATER-20260907 adapter, `codex exec` answered a bare request in FREE
# TEXT (no agent contract was ever injected into the prompt; the
# [agents.strong-reviewer] registration in ~/.codex/config.toml is not applied
# to `codex exec` automatically).  The adapter now composes the prompt as
# agent-contract + request, loading developer_instructions from the mode's
# profile toml (strong-reviewer.toml / strong-reviewer-advisory.toml --
# single source of truth, dedicated single-mode advisory profile).
#
# Capture method: full 2x2 forensic matrix (mode x invocation form) captured
# with the EXACT production adapter prompt shape (_build_prompt(request)
# verbatim -- agent contract + REQUEST separator + request JSON, nothing
# appended) and archived as raw provider NDJSON with the adapter-extracted
# session handle.  Write-side readonly proof is NOT re-asserted inside the
# matrix rounds (no probe suffix -- that would change the provider prompt
# shape); it is carried by codex-cli-l6-evidence.yaml (0.153.4, OS-level
# Seatbelt "operation not permitted", event-backed) whose sandbox arguments
# the adapter does not touch, plus parent-process verification after every
# matrix round (protected.txt sha256 unchanged f5020324..., git clean).
#
# Evidence grading:
#   - result-format contract: EVENT-BACKED -- all four rounds produced the
#     mode-correct strict JSON envelope (finding: dd-review-result/1 PASS;
#     advisory: dd-advisory-result/1 ADVISORY) extracted from the archived
#     raw streams.
#   - session identity continuity: EVENT-BACKED -- the resume round's raw
#     thread.started thread_id equals the initial round's handle, for BOTH
#     modes (finding: 01a07cf6-a226...; advisory: 01a07cf8-04a3...).
#   - write-deny: carried by the OS-level Seatbelt denial proven event-backed
#     in codex-cli-l6-evidence.yaml (0.153.4); matrix rounds add
#     parent-filesystem verification only (no in-prompt write probe, so the
#     production prompt shape stays exact).
