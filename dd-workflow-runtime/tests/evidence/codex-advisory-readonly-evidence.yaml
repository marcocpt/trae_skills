# Advisory + finding invocation-form result-contract & permission evidence
# for codex-cli (FR-MB-012 full forensic matrix for LATER-20260907; companion
# to opencode-advisory-readonly-evidence.yaml).
#
# Forensic finding that triggered a runtime fix BEFORE this capture: with the
# pre-LATER-20260907 adapter, `codex exec` answered a bare request in FREE
# TEXT (no agent contract was ever injected into the prompt; the
# [agents.strong-reviewer] registration in ~/.codex/config.toml is not applied
# to `codex exec` automatically).  The adapter now composes the prompt as
# agent-contract + request, loading developer_instructions from the mode's
# profile toml (strong-reviewer.toml / strong-reviewer-advisory.toml --
# single source of truth, dedicated single-mode advisory profile).
#
# Capture method: full 2x2 forensic matrix (mode x invocation form), every
# round carries a WRITE PROBE (printf > probe-created.txt appended by the
# operator harness) and is archived as raw provider NDJSON with its
# adapter-extracted session handle.  Parent-process verification after every
# round: probe-created.txt absent, protected.txt sha256 unchanged
# (f5020324...), git clean.
#
# Evidence grading:
#   - result-format contract: EVENT-BACKED -- all four rounds produced the
#     mode-correct strict JSON envelope (finding: dd-review-result/1 PASS;
#     advisory: dd-advisory-result/1 ADVISORY) extracted from the archived
#     raw streams.
#   - session identity continuity: EVENT-BACKED -- the resume round's raw
#     thread.started thread_id equals the initial round's handle, for BOTH
#     modes (finding: 01a07cf6-a226...; advisory: 01a07cf8-04a3...).
#   - write-deny: AGENT-SELF-REPORTED + PARENT-FILESYSTEM-VERIFIED -- every
#     round's reviewer reported the write as not executed (read-only
#     filesystem permissions), no probe file was created, and the sandbox
#     boundary itself is the OS-level Seatbelt denial already proven
#     event-backed by codex-cli-l6-evidence.yaml (0.153.4).
